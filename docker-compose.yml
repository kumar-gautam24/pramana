# Host ports are overridable so a port already taken does not block the stack:
# DB_PORT=5433 docker compose up. Service-to-service URLs use container names, so they
# are unaffected.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pramana
      POSTGRES_PASSWORD: pramana
      POSTGRES_DB: pramana
    ports: ["${DB_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pramana"]
      interval: 5s
      retries: 10
    volumes:
      # The entrypoint runs create-databases.sql only when it initialises an empty data
      # directory, so against a pgdata volume from an earlier run it is skipped in
      # silence -- editing the SQL and restarting looks like it worked and changes
      # nothing. `docker compose down -v` drops the volume so the script runs again.
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro

  # Password-protected because Redis will hold sessions: anything that can write a
  # session key mints a clinician session, and a clinician is the only role permitted to
  # decide a case. It is published on a host port, so "it is only localhost" is not the
  # whole story.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-dev-redis-password}"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev-redis-password}", "ping"]
      interval: 5s
      retries: 10
    volumes:
      - redisdata:/data

  policy:
    build:
      context: .
      dockerfile: services/policy/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pramana:pramana@db:5432/pramana_policy
    ports: ["${POLICY_PORT:-8001}:8001"]
    # The model cache is a named volume so a rebuilt container does not re-download the
    # embedder and reranker, which otherwise blows past the first request's timeout.
    volumes:
      - hfcache:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy

  member:
    build:
      context: .
      dockerfile: services/member/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pramana:pramana@db:5432/pramana_member
    ports: ["${MEMBER_PORT:-8005}:8005"]
    depends_on:
      db:
        condition: service_healthy

  adjudication:
    build:
      context: .
      dockerfile: services/adjudication/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://pramana:pramana@db:5432/pramana_adjudication
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password}@redis:6379
      POLICY_URL: http://policy:8001
      MEMBER_URL: http://member:8005
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:14b-instruct}
    ports: ["${ADJUDICATION_PORT:-8002}:8002"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  hfcache:
