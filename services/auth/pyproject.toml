[project]
name = "auth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pramana-common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    # EmailStr on the login/user routes needs this extra; without it the models fail
    # to build at import, which is a startup failure rather than a request-time one.
    "email-validator>=2.2",
    # Argon2id rather than bcrypt: it is the current password-hashing recommendation,
    # it has no 72-byte input truncation to remember, and its cost parameters are
    # tunable without changing library.
    "argon2-cffi>=23.1",
]

[tool.uv.sources]
pramana-common = { path = "../../packages/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
