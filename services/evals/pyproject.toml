[project]
name = "evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pramana-common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[tool.uv.sources]
pramana-common = { path = "../../packages/common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
